name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версии закреплены в ADR-0015.
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  GDTOOLKIT_VERSION: "4.5.*"

jobs:
  test:
    name: Тесты и линт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Линт
        run: tools/lint.sh

      - name: Кэш Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-linux

      - name: Скачать Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sfL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot

      - name: Тесты
        run: |
          export GODOT="$HOME/godot/godot"
          "$GODOT" --version
          tools/test.sh

  export:
    name: Сборки
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Кэш Godot и шаблонов экспорта
        id: export-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-export-${{ env.GODOT_RELEASE }}-linux

      - name: Скачать Godot и шаблоны экспорта
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sfL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -sfL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$dest/"
          rm -rf /tmp/templates /tmp/templates.tpz
          # Оставляем только нужные шаблоны, чтобы кэш был меньше.
          find "$dest" -type f ! -name 'version.txt' ! -name 'macos.zip' \
            ! -name 'windows_release_x86_64.exe' ! -name 'windows_debug_x86_64.exe' \
            ! -name 'linux_release.x86_64' ! -name 'linux_debug.x86_64' -delete

      - name: Собрать macOS, Windows, Linux
        run: |
          export GODOT="$HOME/godot/godot"
          tools/export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vseslav-macos
          path: build/macos/Vseslav.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vseslav-windows
          path: build/windows/Vseslav.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vseslav-linux
          path: build/linux/Vseslav.x86_64
          if-no-files-found: error
